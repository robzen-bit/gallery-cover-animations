<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery Cover Animations</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1f21; --muted: #6b6f74;
    --line: #e4e2dd; --accent: #1d1f21; --accent-text: #ffffff; --hover: #efeeea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141516; --panel: #1c1d1f; --text: #ececec; --muted: #9a9ea3;
      --line: #2c2e31; --accent: #ececec; --accent-text: #141516; --hover: #25272a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    display: grid; grid-template-columns: 280px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; }
  header { padding: 20px 20px 12px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  nav { overflow-y: auto; padding: 4px 10px 16px; flex: 1; }
  nav a { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px;
    border-radius: 8px; color: inherit; text-decoration: none; }
  nav a:hover { background: var(--hover); }
  nav a.active { background: var(--accent); color: var(--accent-text); }
  nav a.active .desc { color: inherit; opacity: .75; }
  .num { font-weight: 600; min-width: 34px; font-variant-numeric: tabular-nums; }
  .desc { color: var(--muted); font-size: 12px; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar .title { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .title span { font-weight: 400; color: var(--muted); margin-left: 8px; }
  button, .bar a { font: inherit; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
  button:hover, .bar a:hover { background: var(--hover); }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .menu { display: none; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 30% 0 0; z-index: 10; transform: translateX(-100%);
      transition: transform .25s; box-shadow: 0 0 40px rgba(0,0,0,.25); }
    body.open aside { transform: none; }
    .menu { display: inline-block; }
    .bar .title span, .bar a { display: none; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Gallery Cover Animations</h1>
    <p>15 layouts + the cover 9 circle alternate. Use ← → to step through.</p>
  </header>
  <nav id="nav"></nav>
</aside>
<main>
  <div class="bar">
    <button class="menu" id="menu" aria-label="Show covers">☰</button>
    <div class="title" id="title"></div>
    <button id="replay" title="Replay the load animation">Replay</button>
    <button id="prev" aria-label="Previous cover">←</button>
    <button id="next" aria-label="Next cover">→</button>
    <a id="open" target="_blank" rel="noopener">Open alone ↗</a>
  </div>
  <iframe id="frame" title="Gallery cover preview"></iframe>
</main>
<script>
const covers = [
  { id: '1', file: 'gallery-cover-1.html', desc: 'Full-bleed, studio top, title bottom-right' },
  { id: '2', file: 'gallery-cover-2.html', desc: 'Full-bleed with a thin traced frame' },
  { id: '3', file: 'gallery-cover-3.html', desc: 'Title in a centered bordered box' },
  { id: '4', file: 'gallery-cover-4.html', desc: 'Photo on a white mat' },
  { id: '5', file: 'gallery-cover-5.html', desc: 'Header band with logo, photo below' },
  { id: '6', file: 'gallery-cover-6.html', desc: 'Photo in a morphing blob' },
  { id: '7', file: 'gallery-cover-7.html', desc: 'Split: photo left, text right' },
  { id: '8', file: 'gallery-cover-8.html', desc: 'Split: photo strip, centered text' },
  { id: '9', file: 'gallery-cover-9.html', desc: 'Square photo inset' },
  { id: '9 alt', file: 'gallery-cover-9-circle.html', desc: 'Circular photo inset' },
  { id: '10', file: 'gallery-cover-10.html', desc: 'Portrait 2:3 photo inset' },
  { id: '11', file: 'gallery-cover-11.html', desc: 'Text column left, landscape photo right' },
  { id: '12', file: 'gallery-cover-12.html', desc: 'Collage of five photos' },
  { id: '13', file: 'gallery-cover-13.html', desc: 'Photo top, colored band below' },
  { id: '14', file: 'gallery-cover-14.html', desc: 'Logo top, landscape photo centered' },
  { id: '15', file: 'gallery-cover-15.html', desc: 'Three photos fanning out' },
];
const $ = id => document.getElementById(id);
const nav = $('nav'), frame = $('frame');
let current = 0;

covers.forEach((c, i) => {
  const a = document.createElement('a');
  a.href = '#' + encodeURIComponent(c.id);
  a.innerHTML = `<span class="num">${c.id}</span><span class="desc">${c.desc}</span>`;
  a.addEventListener('click', e => { e.preventDefault(); show(i); document.body.classList.remove('open'); });
  nav.appendChild(a);
});

function show(i) {
  current = (i + covers.length) % covers.length;
  const c = covers[current];
  frame.src = 'covers/' + c.file;
  $('open').href = 'covers/' + c.file;
  $('title').innerHTML = `Cover ${c.id}<span>${c.desc}</span>`;
  [...nav.children].forEach((a, j) => a.classList.toggle('active', j === current));
  nav.children[current].scrollIntoView({ block: 'nearest' });
  history.replaceState(null, '', '#' + encodeURIComponent(c.id));
}

$('prev').onclick = () => show(current - 1);
$('next').onclick = () => show(current + 1);
$('replay').onclick = () => { frame.src = frame.src; };
$('menu').onclick = () => document.body.classList.toggle('open');
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') show(current - 1);
  if (e.key === 'ArrowRight') show(current + 1);
});

const start = covers.findIndex(c => c.id === decodeURIComponent(location.hash.slice(1)));
show(start >= 0 ? start : 0);
</script>
</body>
</html>
